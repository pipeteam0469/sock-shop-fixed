version: '3.8'

services:
  front-end:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    ports:
      - "80:8079"
    environment:
      - NODE_ENV=production
      - CATALOGUE_HOST=catalogue
      - USER_HOST=user
      - PAYMENT_HOST=payment
    depends_on:
      - catalogue
      - user
      - payment
    restart: always

  catalogue:
    build:
      context: ./catalogue
      dockerfile: docker/catalogue/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - MONGO_HOST=catalogue-db
    depends_on:
      - catalogue-db
    restart: always

  catalogue-db:
    build:
      context: ./catalogue
      dockerfile: docker/catalogue-db/Dockerfile
    volumes:
      - catalogue-db-data:/var/lib/mysql
    restart: always

  user:
    build:
      context: ./user
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - MONGO_HOST=user-db
    depends_on:
      - user-db
    restart: always

  user-db:
    image: mongo:4.4
    volumes:
      - user-db-data:/data/db
    restart: always

  payment:
    build:
      context: ./payment
      dockerfile: docker/payment/Dockerfile
    ports:
      - "8080:8080"
    restart: always

volumes:
  catalogue-db-data:
  user-db-data:
