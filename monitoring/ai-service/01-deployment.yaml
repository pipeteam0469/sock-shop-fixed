apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-service
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-service-role
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "events", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-service-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-service-role
subjects:
- kind: ServiceAccount
  name: ai-service
  namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: monitoring
  labels:
    app: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      serviceAccountName: ai-service
      containers:
      - name: ai-service
        image: 192.168.74.68:5000/ai-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-service-secrets
              key: gemini-api-key
        - name: SLACK_WEBHOOK
          valueFrom:
            secretKeyRef:
              name: ai-service-secrets
              key: slack-webhook
        - name: GEMINI_MODEL
          value: "gemini-2.0-flash"
        - name: PROMETHEUS_URL
          value: "http://prometheus.monitoring.svc.cluster.local:9090"
        - name: K8S_NAMESPACE
          value: "default"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: monitoring
spec:
  selector:
    app: ai-service
  ports:
  - name: http
    port: 8000
    targetPort: 8000
  type: ClusterIP
---
# Secret for API keys (create with: kubectl create secret generic ai-service-secrets -n monitoring --from-literal=gemini-api-key=YOUR_KEY --from-literal=slack-webhook=YOUR_WEBHOOK)
apiVersion: v1
kind: Secret
metadata:
  name: ai-service-secrets
  namespace: monitoring
type: Opaque
stringData:
  gemini-api-key: "REPLACE_WITH_YOUR_GEMINI_API_KEY"
  slack-webhook: "REPLACE_WITH_YOUR_SLACK_WEBHOOK_URL"
