apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'category']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'ai-service'
      routes:
      # Critical alerts get immediate notification
      - match:
          severity: critical
        receiver: 'ai-service'
        group_wait: 5s
        repeat_interval: 30m
      # Warning alerts get grouped and sent after a delay
      - match:
          severity: warning
        receiver: 'ai-service'
        group_wait: 30s
        repeat_interval: 2h

    receivers:
    - name: 'ai-service'
      webhook_configs:
      - url: 'http://ai-service.monitoring.svc.cluster.local:8000/alert'
        send_resolved: true
        max_alerts: 0
