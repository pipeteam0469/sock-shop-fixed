apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-db
  labels:
    app: user-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-db
  template:
    metadata:
      labels:
        app: user-db
    spec:
      containers:
      - name: user-db
        image: mongo:4.4
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: user-db-storage
          mountPath: /data/db
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false # MongoDB needs to write to its data directory
          runAsNonRoot: false # MongoDB image typically runs as root initially
          capabilities:
            drop:
              - ALL
      volumes:
      - name: user-db-storage
        mountPath: /var/lib/mysql
---
apiVersion: v1
kind: Service
metadata:
  name: user-db
  labels:
    app: user-db
spec:
  ports:
  - port: 27017
    targetPort: 27017
    protocol: TCP
  selector:
    app: user-db
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: user-db-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
